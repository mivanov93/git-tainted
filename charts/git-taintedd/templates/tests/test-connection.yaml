apiVersion: v1
kind: Pod
metadata:
  name: {{ include "git-taintedd.fullname" . }}-test-connection
  labels:
    {{- include "git-taintedd.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: readyz
      image: curlimages/curl:8.11.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # Fail (non-zero) unless the server reports ready. --fail makes curl exit
      # non-zero on any HTTP >= 400, so the Pod (and `helm test`) fail loudly.
      command:
        - /bin/sh
        - -ec
        - |
          url="http://{{ include "git-taintedd.fullname" . }}:{{ .Values.service.port }}/readyz"
          echo "GET ${url}"
          curl --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 2 --retry-connrefused "${url}"
          echo
          echo "readyz OK"
