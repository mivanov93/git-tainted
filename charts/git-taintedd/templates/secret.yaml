{{- /*
Emit a Secret ONLY when the chart owns it (secrets.create) AND at least one of
the four sensitive values is non-empty. When secrets.existingSecret is set the
chart references that Secret instead and renders nothing here. Uses stringData
so values are written verbatim (Kubernetes base64-encodes them on store).
*/ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $d := .Values.secrets.data }}
{{- if or $d.mysqlDSN $d.apiKeys $d.apiKeysSHA256 $d.basicAuth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-taintedd.fullname" . }}
  labels:
    {{- include "git-taintedd.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $d.mysqlDSN }}
  GT_MYSQL_DSN: {{ $d.mysqlDSN | quote }}
  {{- end }}
  {{- if $d.apiKeys }}
  GT_API_KEYS: {{ $d.apiKeys | quote }}
  {{- end }}
  {{- if $d.apiKeysSHA256 }}
  GT_API_KEYS_SHA256: {{ $d.apiKeysSHA256 | quote }}
  {{- end }}
  {{- if $d.basicAuth }}
  GT_BASIC_AUTH: {{ $d.basicAuth | quote }}
  {{- end }}
{{- end }}
{{- end }}
