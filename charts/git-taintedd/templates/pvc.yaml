{{- /*
The sqlite data PVC. Created only when persistence is on, no existing claim is
supplied, and the sqlite driver is in use (mysql needs no local volume).
*/ -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (eq .Values.config.db.driver "sqlite") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "git-taintedd.pvcName" . }}
  labels:
    {{- include "git-taintedd.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- if .Values.persistence.storageClass }}
  {{- if (eq "-" .Values.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
