# Release — runs on a pushed semver tag (vX.Y.Z). Publishes:
#   - the multi-arch server image to Docker Hub (mivanov93/git-taintedd), signed
#     keylessly with cosign, with SBOM + provenance attestations;
#   - all three binaries — git-tainted, git-tainted-ctl, and the git-taintedd
#     server (linux/darwin × amd64/arm64) — as version-stamped tar.gz + a
#     SHA256SUMS file;
#   - the Helm chart to GHCR OCI (oci://ghcr.io/mivanov93/charts) and as a
#     GitHub Release asset;
#   - a GitHub Release with generated notes and all the above attached.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  — Docker Hub user with push to mivanov93/git-taintedd
#   DOCKERHUB_TOKEN     — Docker Hub access token (NOT the account password)
# GHCR push, the GitHub Release, and cosign keyless signing all use the
# built-in GITHUB_TOKEN / OIDC — no extra secrets needed.
name: release

on:
  push:
    tags:
      - "v*.*.*"

# Least-privilege floor: read-only at the workflow level. Each job elevates only
# what it needs (image → packages+id-token for GHCR/cosign; chart → packages;
# release → contents:write for the GitHub Release + asset upload).
permissions:
  contents: read

env:
  IMAGE: docker.io/mivanov93/git-taintedd

jobs:
  image:
    name: image (build / push / sign)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=git-taintedd
            org.opencontainers.image.licenses=BUSL-1.1

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless sign the exact pushed digest (every tag points at this digest).
      - name: Cosign sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  binaries:
    name: binaries (CLIs + server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # Cross-compile all three binaries — the two client CLIs plus the server
      # (which ALSO ships as the container image) — for linux/darwin ×
      # amd64/arm64, version-stamped, tar.gz'd, with checksums.
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          GOEXPERIMENT: jsonv2
        run: |
          set -euo pipefail
          LDFLAGS="-s -w -X github.com/mivanov93/git-tainted/internal/buildinfo.Version=${VERSION}"
          OUT="dist"
          mkdir -p "${OUT}"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              for cmd in git-tainted git-tainted-ctl git-taintedd; do
                bindir="${OUT}/${cmd}_${VERSION}_${os}_${arch}"
                mkdir -p "${bindir}"
                echo "building ${cmd} ${os}/${arch}"
                CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
                  go build -trimpath -ldflags "${LDFLAGS}" \
                  -o "${bindir}/${cmd}" "./cmd/${cmd}"
                cp LICENSE README.md "${bindir}/" 2>/dev/null || true
                tar -C "${OUT}" -czf "${bindir}.tar.gz" "$(basename "${bindir}")"
                rm -rf "${bindir}"
              done
            done
          done
          ( cd "${OUT}" && sha256sum ./*.tar.gz > SHA256SUMS )
          echo "--- artifacts ---"
          ls -la "${OUT}"
          cat "${OUT}/SHA256SUMS"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  chart:
    name: chart (package / push / asset)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.4

      - name: Log in to GHCR (Helm OCI registry)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Chart SemVer must NOT carry a leading 'v'; strip it from the tag. The
      # appVersion (image tag) keeps the original ref (with 'v') to match the
      # image tags published by metadata-action's {{version}}.
      - name: Package chart
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CHART_VERSION="${TAG#v}"
          mkdir -p dist
          helm package charts/git-taintedd \
            --version "${CHART_VERSION}" \
            --app-version "${TAG}" \
            --destination dist
          TGZ="dist/git-taintedd-${CHART_VERSION}.tgz"
          echo "tgz=${TGZ}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          ls -la dist

      - name: Push chart to GHCR OCI
        env:
          TGZ: ${{ steps.pkg.outputs.tgz }}
        run: helm push "${TGZ}" oci://ghcr.io/mivanov93/charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chart
          path: ${{ steps.pkg.outputs.tgz }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [image, binaries, chart]
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries
          path: dist

      - name: Download chart artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chart
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.tgz
