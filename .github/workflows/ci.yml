# CI — runs on every push to master and every pull request.
#
# No repository secrets are required for CI. The release pipeline (release.yml)
# is what needs DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  go:
    name: go (build / vet / lint / test / race / e2e / deadcode / vuln)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # cache managed below — setup-go's exact go.sum key has no restore-keys
          # fallback (actions/setup-go#404), so every Renovate dep-bump misses.
          cache: false

      # Restore-keys is the part setup-go can't give us: a changed go.sum (every
      # Renovate dep-bump PR) falls back to the nearest warm cache so only the
      # bumped dependency recompiles, instead of a cold rebuild of the whole
      # modernc/sqlite + golangci tree.
      - name: Go module + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # golangci-lint keeps its own per-package analysis cache, separate from the
      # Go build cache that setup-go restores. Persisting it lets unchanged
      # packages skip re-linting. golangci validates entries against the analyzer
      # + Go versions internally, so a stale-key restore is always safe.
      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-${{ runner.os }}-

      # Uses the repo-pinned golangci-lint v2 (go.mod tool dependency) via
      # `make lint` — do NOT substitute a different linter or version.
      - name: Lint (golangci-lint v2, repo-pinned)
        run: make lint

      - name: Test
        run: go test ./... -count=1

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: E2E
        run: make e2e

      # deadcode + govulncheck are pinned via go.mod tool directives (Renovate
      # bumps them); do NOT re-add @latest — it defeats caching + reproducibility.
      - name: Deadcode (must be empty)
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode -test ./...)"
          if [ -n "${out}" ]; then
            echo "::error::deadcode found unreachable code:"
            echo "${out}"
            exit 1
          fi
          echo "no dead code"

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck ./...

  helm:
    name: helm (lint + template + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # kubeconform is a Go tool; setup-go lets us `go install` it.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # cache managed below (restore-keys fallback setup-go lacks; #404).
          cache: false

      - name: Go module + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-helm-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-helm-${{ runner.os }}-

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.21.1

      # Pinned via a go.mod tool directive (Renovate-managed); the module cache
      # builds it. Do NOT re-add @latest.
      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform

      - name: Helm lint (strict)
        run: helm lint charts/git-taintedd --strict

      # Render several value permutations and validate each against the
      # Kubernetes OpenAPI schemas. ServiceMonitor is a CRD (not a built-in
      # API), so it is skipped. --kube-version satisfies the chart kubeVersion
      # gate for offline templating.
      - name: Helm template + kubeconform (permutations)
        run: |
          set -euo pipefail
          MYSQL_DSN='u:p@tcp(mysql:3306)/gt?multiStatements=true&parseTime=false&clientFoundRows=true'
          # render <label> [extra helm --set args...]  → pipe through kubeconform.
          render() {
            label="$1"; shift
            echo "== ${label} =="
            helm template gt charts/git-taintedd --kube-version 1.29.0 "$@" \
              | kubeconform -strict -summary -skip ServiceMonitor
          }

          render "defaults"
          render "sqlite + metrics + serviceMonitor" \
            --set metrics.enabled=true --set metrics.serviceMonitor.enabled=true
          render "mysql driver (no persistence)" \
            --set config.db.driver=mysql --set persistence.enabled=false \
            --set secrets.data.mysqlDSN="${MYSQL_DSN}"
          render "auth apikey" \
            --set auth.mode=apikey --set secrets.data.apiKeys=k1
          render "ingress" \
            --set ingress.enabled=true --set ingress.className=nginx \
            --set 'ingress.hosts[0].host=gt.example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' \
            --set 'ingress.hosts[0].paths[0].pathType=Prefix'
          render "autoscaling + mysql" \
            --set autoscaling.enabled=true --set config.db.driver=mysql \
            --set persistence.enabled=false \
            --set secrets.data.mysqlDSN="${MYSQL_DSN}"

      # The chart MUST refuse an unsafe sqlite multi-writer config. Assert it.
      - name: Helm guard — sqlite + replicaCount>1 must fail
        run: |
          if helm template gt charts/git-taintedd --kube-version 1.29.0 \
               --set replicaCount=2 >/dev/null 2>&1; then
            echo "::error::expected helm to fail for sqlite + replicaCount>1"
            exit 1
          fi
          echo "guard OK: sqlite + replicaCount>1 is rejected"

  lint:
    name: lint (actionlint / hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # cache managed below (restore-keys fallback setup-go lacks; #404).
          cache: false

      - name: Go module + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-lint-${{ runner.os }}-

      # actionlint is pinned via a go.mod tool directive (Renovate-managed).
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint
          actionlint -color

      - name: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

  docker-build:
    name: docker build (validation, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Prove the Dockerfile builds with version stamping; do NOT push or load.
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: false
          platforms: linux/amd64
          build-args: |
            VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
